<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mini Sudoku</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

:root{
--bg:#f3f2ee;
--app:#faf9f6;
--card:#ffffff;
--border:#e5dfd5;
--text:#111111;
--muted:#aaaaaa;
--soft:#ece7de;
--softText:#666;
--blue:#0a84ff;
--grid:#3d3d3d;
--line:#8f8f8f;
--cell:#fffdfa;
--selected:#dcebff;
--selectedLine:#66b0ff;
--related:#f2f7fb;
--green:#1fa85c;
--greenBg:#dff8e7;
--danger:#ff4d4f;
--shadow:rgba(0,0,0,.08);
--shadowStrong:rgba(0,0,0,.16);
}

html[data-theme="dark"]{
--bg:#0f1011;
--app:#151617;
--card:#1d1f21;
--border:#34363a;
--text:#f5f5f5;
--muted:#8f8f94;
--soft:#2b2d30;
--softText:#d0d0d0;
--blue:#5ab0ff;
--grid:#5d5f63;
--line:#4a4c50;
--cell:#202224;
--selected:#1d4c79;
--selectedLine:#6ab8ff;
--related:#263548;
--green:#79ffae;
--greenBg:#1f6a42;
--danger:#ff6b6b;
--shadow:rgba(0,0,0,.22);
--shadowStrong:rgba(0,0,0,.35);
}

body{
margin:0;
background:var(--bg);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
color:var(--text);
}

.app{
max-width:430px;
margin:auto;
min-height:100svh;
padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
background:var(--app);
position:relative;
}

.headerRow{
display:grid;
grid-template-columns:44px minmax(0,1fr) 44px;
align-items:center;
gap:10px;
margin:8px 0 16px;
}

.title{
font-size:22px;
font-weight:900;
letter-spacing:-.45px;
text-align:center;
white-space:nowrap;
line-height:1;
}

.levelBtn{
height:44px;
width:44px;
padding:0;
border-radius:15px;
border:1px solid var(--border);
background:var(--card);
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
font-weight:900;
color:var(--text);
justify-self:start;
}

.levelMenu{
position:absolute;
left:16px;
top:74px;
width:150px;
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:8px;
display:none;
z-index:99;
box-shadow:0 20px 50px var(--shadowStrong);
}

.levelMenu.show{
display:block;
}

.settingsBtn{
width:44px;
height:44px;
border-radius:15px;
border:1px solid var(--border);
background:var(--card);
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
justify-self:end;
}

.settingsMenu{
position:absolute;
right:16px;
top:74px;
width:230px;
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:8px;
display:none;
z-index:99;
box-shadow:0 20px 50px var(--shadowStrong);
}

.settingsMenu.show{
display:block;
}

.menuItem{
height:46px;
display:flex;
align-items:center;
padding:0 14px;
border-radius:12px;
font-size:15px;
font-weight:800;
white-space:nowrap;
}

.menuItem.active{
background:var(--soft);
color:var(--blue);
}

.topbar{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:14px;
}

.pill{
height:50px;
border-radius:18px;
background:var(--card);
border:1px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
font-weight:850;
}

.boardWrap{
position:relative;
}

.boardCard{
background:var(--card);
border:1px solid var(--border);
border-radius:26px;
padding:14px;
transition:.25s;
}

.board{
position:relative;
display:grid;
grid-template-columns:repeat(6,minmax(0,1fr));
grid-template-rows:repeat(6,minmax(0,1fr));
aspect-ratio:1;
border:4px solid var(--grid);
border-radius:18px;
overflow:hidden;
background:var(--cell);
transition:.25s;
}

.board.finished{
opacity:.16;
filter:blur(1px);
}

.board::after{
content:"";
position:absolute;
inset:0;
pointer-events:none;
z-index:5;
background:
linear-gradient(to right,
transparent calc(16.666% - .5px), var(--line) calc(16.666% - .5px), var(--line) calc(16.666% + .5px), transparent calc(16.666% + .5px),
transparent calc(33.333% - .5px), var(--line) calc(33.333% - .5px), var(--line) calc(33.333% + .5px), transparent calc(33.333% + .5px),
transparent calc(50% - 2.5px), var(--grid) calc(50% - 2.5px), var(--grid) calc(50% + 2.5px), transparent calc(50% + 2.5px),
transparent calc(66.666% - .5px), var(--line) calc(66.666% - .5px), var(--line) calc(66.666% + .5px), transparent calc(66.666% + .5px),
transparent calc(83.333% - .5px), var(--line) calc(83.333% - .5px), var(--line) calc(83.333% + .5px), transparent calc(83.333% + .5px)
),
linear-gradient(to bottom,
transparent calc(16.666% - .5px), var(--line) calc(16.666% - .5px), var(--line) calc(16.666% + .5px), transparent calc(16.666% + .5px),
transparent calc(33.333% - 2.5px), var(--grid) calc(33.333% - 2.5px), var(--grid) calc(33.333% + 2.5px), transparent calc(33.333% + 2.5px),
transparent calc(50% - .5px), var(--line) calc(50% - .5px), var(--line) calc(50% + .5px), transparent calc(50% + .5px),
transparent calc(66.666% - 2.5px), var(--grid) calc(66.666% - 2.5px), var(--grid) calc(66.666% + 2.5px), transparent calc(66.666% + 2.5px),
transparent calc(83.333% - .5px), var(--line) calc(83.333% - .5px), var(--line) calc(83.333% + .5px), transparent calc(83.333% + .5px)
);
}

.cell{
display:flex;
align-items:center;
justify-content:center;
background:var(--cell);
font-size:clamp(26px,8vw,38px);
font-weight:900;
color:var(--text);
transition:.15s;
user-select:none;
position:relative;
z-index:1;
min-width:0;
min-height:0;
border:none;
}

.cell:active{
transform:scale(.92);
filter:brightness(.95);
}

.given{
color:var(--muted);
}

.related{
background:var(--related);
}

.selected{
background:var(--selected)!important;
z-index:2;
}

.selected::after{
content:"";
position:absolute;
inset:10px;
border:3px solid var(--selectedLine);
border-radius:12px;
pointer-events:none;
z-index:3;
}

.completed{
background:var(--greenBg)!important;
color:var(--green)!important;
}

.conflict::before{
content:"";
position:absolute;
inset:7px;
border:3px solid var(--danger);
border-radius:14px;
pointer-events:none;
z-index:4;
animation:conflictPulse .7s infinite;
}

.selected.conflict::before{
inset:5px;
border-radius:15px;
}

.selected.conflict::after{
inset:13px;
border-radius:10px;
}

@keyframes conflictPulse{
0%{opacity:.25}
50%{opacity:1}
100%{opacity:.25}
}

.keypad{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:14px;
}

button{
height:58px;
border-radius:18px;
border:1px solid var(--border);
background:var(--card);
color:var(--blue);
font-size:28px;
font-weight:900;
transition:.12s;
}

.small{
font-size:16px;
color:var(--softText);
}

.tools{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin:42px 48px 0;
}

.tool{
height:44px;
border-radius:16px;
background:var(--soft);
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
font-weight:850;
color:var(--softText);
transition:.14s;
}

button,
.pill,
.tool,
.levelBtn,
.settingsBtn,
.menuItem{
position:relative;
overflow:hidden;
transform:translateZ(0);
box-shadow:0 8px 18px var(--shadow);
transition:transform .12s ease,filter .12s ease,box-shadow .12s ease,background .12s ease;
}

button:active,
.pill:active,
.tool:active,
.levelBtn:active,
.settingsBtn:active,
.menuItem:active{
transform:scale(.94);
filter:brightness(.94);
box-shadow:0 3px 8px var(--shadowStrong) inset;
}

.ripple{
position:absolute;
border-radius:50%;
background:rgba(10,132,255,.22);
transform:scale(0);
animation:ripple .45s ease-out;
pointer-events:none;
}

@keyframes ripple{
to{
transform:scale(3.2);
opacity:0;
}
}

.winOverlay{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center;
padding:28px;
z-index:20;
}

.winBox{
width:100%;
background:var(--card);
border:1px solid rgba(31,168,92,.35);
border-radius:24px;
padding:24px 18px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.22);
animation:pop .28s ease;
}

@keyframes pop{
from{
opacity:0;
transform:translateY(10px) scale(.96);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.winTitle{
font-size:28px;
font-weight:900;
color:var(--green);
margin-bottom:10px;
}

.winDesc{
font-size:17px;
font-weight:800;
line-height:1.5;
}

.winGlow{
animation:glow 1s infinite;
}

@keyframes glow{
0%{
box-shadow:0 0 0 0 rgba(31,168,92,.1);
}
50%{
box-shadow:0 0 0 8px rgba(31,168,92,.35);
}
100%{
box-shadow:0 0 0 0 rgba(31,168,92,.1);
}
}

.donationOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
padding:24px;
z-index:200;
}

.donationCard{
width:100%;
max-width:360px;
background:var(--card);
border-radius:26px;
padding:18px;
border:1px solid var(--border);
text-align:center;
}

.donationCard h3{
margin:0 0 14px;
font-size:24px;
}

.donationCard img{
width:100%;
border-radius:18px;
}

.closeBtn{
margin-top:14px;
height:44px;
border-radius:14px;
font-size:16px;
color:var(--text);
}

@media(max-width:390px){
.headerRow{
grid-template-columns:42px minmax(0,1fr) 42px;
gap:8px;
}

.title{
font-size:20px;
}

.levelBtn{
width:42px;
height:42px;
font-size:14px;
}

.settingsBtn{
width:42px;
height:42px;
}

.settingsMenu{
width:224px;
}
}

@media(max-height:760px){
.app{
padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));
}

.headerRow{
margin:4px 0 14px;
}

.title{
font-size:20px;
}

.levelBtn{
width:40px;
height:40px;
font-size:13px;
}

.settingsBtn{
width:40px;
height:40px;
}

button{
height:54px;
}

.cell{
font-size:clamp(22px,7vw,34px);
}

.tools{
margin:18px 60px 0;
}
}
</style>
</head>

<body>

<div class="app">

<div class="headerRow">
<div class="levelBtn" id="levelBtn" onclick="toggleLevelMenu()">N</div>
<div class="title">Mini Sudoku</div>
<div class="settingsBtn" onclick="toggleMenu()">⚙️</div>
</div>

<div class="levelMenu" id="levelMenu">
<div class="menuItem" onclick="setLevel('easy')">Easy</div>
<div class="menuItem" onclick="setLevel('normal')">Normal</div>
<div class="menuItem" onclick="setLevel('hard')">Hard</div>
</div>

<div class="settingsMenu" id="menu">
<div class="menuItem" id="relaxMenuItem" onclick="toggleRelaxationMode()">🧘 Relaxation: Off</div>
<div class="menuItem" onclick="toggleTheme()">🌓 Toggle Theme</div>
<div class="menuItem" onclick="openDonation()">💙 Donation</div>
</div>

<div class="topbar">
<div class="pill">⏱ <span id="timer">0:00</span></div>
<div class="pill" onclick="newGame()">🎲 ด่านใหม่</div>
</div>

<div class="boardWrap">

<div class="boardCard" id="boardCard">
<div class="board" id="board"></div>
</div>

<div class="winOverlay" id="winOverlay">
<div class="winBox">
<div class="winTitle">🎉 ชนะแล้ว!</div>
<div class="winDesc" id="winText"></div>
</div>
</div>

</div>

<div class="keypad">
<button onclick="pressNum(1)">1</button>
<button onclick="pressNum(2)">2</button>
<button onclick="pressNum(3)">3</button>
<button class="small" onclick="erase()">⌫</button>

<button onclick="pressNum(4)">4</button>
<button onclick="pressNum(5)">5</button>
<button onclick="pressNum(6)">6</button>
<button class="small" onclick="undo()">↶</button>
</div>

<div class="tools">
<div class="tool" id="hintBtn" onclick="hint()">💡 Hint</div>
<div class="tool" onclick="resetBoard()">🔁 Reset</div>
</div>

</div>

<div class="donationOverlay" id="donationOverlay" onclick="closeDonation(event)">
<div class="donationCard">
<h3>Donation</h3>
<img src="IMG_2221.jpeg">
<button class="closeBtn" onclick="hideDonation()">Close</button>
</div>
</div>

<script>
let puzzle,board,solution;
let selected=null;
let history=[];
let seconds=0;
let timer=null;
let finished=false;
let hintUsed=0;
let currentLevel="normal";

let relaxationMode=false;
let gameRelaxed=false;

let hintCooldown=false;
let hintLeft=0;
let hintTimer=null;

const boardEl=document.getElementById("board");
const timerEl=document.getElementById("timer");
const boardCard=document.getElementById("boardCard");
const winOverlay=document.getElementById("winOverlay");
const winText=document.getElementById("winText");
const hintBtn=document.getElementById("hintBtn");

function vibrate(p=15){
if(navigator.vibrate)navigator.vibrate(p);
}

function shuffle(arr){
const a=[...arr];
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function getTargetClues(){
if(currentLevel==="easy") return 17;
if(currentLevel==="hard") return 6;
return 11;
}

function generateSolution(){
const base=[
[1,2,3,4,5,6],
[4,5,6,1,2,3],
[2,3,4,5,6,1],
[5,6,1,2,3,4],
[3,4,5,6,1,2],
[6,1,2,3,4,5]
];

let rows=[],cols=[];

shuffle([0,1,2]).forEach(b=>{
shuffle([0,1]).forEach(r=>{
rows.push(b*2+r);
});
});

shuffle([0,1]).forEach(s=>{
shuffle([0,1,2]).forEach(c=>{
cols.push(s*3+c);
});
});

const nums=shuffle([1,2,3,4,5,6]);
const map={};

[1,2,3,4,5,6].forEach((n,i)=>{
map[n]=nums[i];
});

return rows.flatMap(r=>cols.map(c=>map[base[r][c]]));
}

function isValid(grid,index,num){
const row=Math.floor(index/6);
const col=index%6;

for(let c=0;c<6;c++){
if(c!==col&&grid[row*6+c]===num)return false;
}

for(let r=0;r<6;r++){
if(r!==row&&grid[r*6+col]===num)return false;
}

const br=Math.floor(row/2)*2;
const bc=Math.floor(col/3)*3;

for(let r=0;r<2;r++){
for(let c=0;c<3;c++){
const i=(br+r)*6+(bc+c);
if(i!==index&&grid[i]===num)return false;
}
}

return true;
}

function countSolutions(grid){
const empty=grid.indexOf(0);

if(empty===-1)return 1;

let count=0;

for(const n of shuffle([1,2,3,4,5,6])){
if(isValid(grid,empty,n)){
grid[empty]=n;
count+=countSolutions(grid);
grid[empty]=0;
if(count>1)return count;
}
}

return count;
}

function generatePuzzle(){
let best=null;
let bestDiff=999;

for(let attempt=0;attempt<80;attempt++){
const sol=generateSolution();
const p=[...sol];

let cells=shuffle([...Array(36).keys()]);
const target=getTargetClues();

for(const i of cells){
const keep=p[i];

p[i]=0;

const clues=p.filter(v=>v!==0).length;
const unique=countSolutions([...p])===1;

if(!unique||clues<target){
p[i]=keep;
}
}

const clues=p.filter(v=>v!==0).length;
const diff=Math.abs(clues-target);

if(diff<bestDiff){
bestDiff=diff;
best={p,s:sol};
}

if(clues===target){
return{p,s:sol};
}
}

return best;
}

function newGame(){
const g=generatePuzzle();

puzzle=g;
board=[...g.p];
solution=[...g.s];

selected=null;
history=[];
seconds=0;
finished=false;
hintUsed=0;
gameRelaxed=relaxationMode;

clearInterval(timer);

if(gameRelaxed){
timerEl.textContent="Relax";
}else{
timer=setInterval(()=>{
if(finished)return;

seconds++;

const m=Math.floor(seconds/60);
const s=seconds%60;

timerEl.textContent=`${m}:${String(s).padStart(2,"0")}`;
},1000);

timerEl.textContent="0:00";
}

winOverlay.style.display="none";
boardEl.classList.remove("finished");
boardCard.classList.remove("winGlow");

resetHintCooldown();
render();
vibrate(10);
}

function render(){
boardEl.innerHTML="";

board.forEach((value,index)=>{
const cell=document.createElement("div");

cell.className="cell";

if(value)cell.textContent=value;

if(puzzle.p[index]){
cell.classList.add("given");
}

cell.onclick=()=>{
selected=index;
render();
vibrate(8);
};

boardEl.appendChild(cell);
});

highlight();
markDone();
showConflict();
}

function highlight(){
const cells=document.querySelectorAll(".cell");

if(selected===null)return;

const row=Math.floor(selected/6);
const col=selected%6;
const value=board[selected];

cells.forEach((cell,i)=>{
const r=Math.floor(i/6);
const c=i%6;

if(r===row||c===col||(value&&board[i]===value)){
cell.classList.add("related");
}
});

cells[selected].classList.add("selected");
}

function markDone(){
const cells=document.querySelectorAll(".cell");

cells.forEach(c=>c.classList.remove("completed"));

for(let r=0;r<6;r++){
let ok=true;

for(let c=0;c<6;c++){
const i=r*6+c;
if(board[i]!==solution[i])ok=false;
}

if(ok){
for(let c=0;c<6;c++){
cells[r*6+c].classList.add("completed");
}
}
}

for(let c=0;c<6;c++){
let ok=true;

for(let r=0;r<6;r++){
const i=r*6+c;
if(board[i]!==solution[i])ok=false;
}

if(ok){
for(let r=0;r<6;r++){
cells[r*6+c].classList.add("completed");
}
}
}

for(let br=0;br<3;br++){
for(let bc=0;bc<2;bc++){
let ok=true;
let block=[];

for(let r=0;r<2;r++){
for(let c=0;c<3;c++){
const i=(br*2+r)*6+(bc*3+c);

block.push(i);

if(board[i]!==solution[i])ok=false;
}
}

if(ok){
block.forEach(i=>{
cells[i].classList.add("completed");
});
}
}
}
}

function pressNum(num){
if(selected===null||puzzle.p[selected]||finished)return;

history.push([...board]);
board[selected]=num;

render();

if(isConflict(selected)){
vibrate([40,40,40]);
}else{
vibrate(12);
}

checkWin();
}

function erase(){
if(selected===null||puzzle.p[selected]||finished)return;

history.push([...board]);
board[selected]=0;

render();
vibrate(10);
}

function undo(){
if(!history.length||finished)return;

board=history.pop();

render();
vibrate(15);
}

function resetBoard(){
board=[...puzzle.p];

selected=null;
history=[];
finished=false;
hintUsed=0;

winOverlay.style.display="none";
boardEl.classList.remove("finished");
boardCard.classList.remove("winGlow");

resetHintCooldown();
render();
vibrate(20);
}

function hint(){
if(finished||hintCooldown)return;

const options=board
.map((v,i)=>v!==solution[i]&&!puzzle.p[i]?i:null)
.filter(v=>v!==null);

if(!options.length)return;

history.push([...board]);

const pick=options[Math.floor(Math.random()*options.length)];

board[pick]=solution[pick];
selected=pick;
hintUsed++;

render();
checkWin();
vibrate(25);
startHintCooldown();
}

function startHintCooldown(){
hintCooldown=true;
hintLeft=5;

hintBtn.style.opacity=".55";
hintBtn.textContent=`💡 ${hintLeft}s`;

clearInterval(hintTimer);

hintTimer=setInterval(()=>{
hintLeft--;

if(hintLeft>0){
hintBtn.textContent=`💡 ${hintLeft}s`;
}else{
resetHintCooldown();
}
},1000);
}

function resetHintCooldown(){
clearInterval(hintTimer);

hintCooldown=false;

hintBtn.style.opacity="1";
hintBtn.textContent="💡 Hint";
}

function isConflict(index){
const value=board[index];

if(!value)return false;

const row=Math.floor(index/6);
const col=index%6;

for(let c=0;c<6;c++){
const i=row*6+c;

if(i!==index&&board[i]===value)return true;
}

for(let r=0;r<6;r++){
const i=r*6+col;

if(i!==index&&board[i]===value)return true;
}

const br=Math.floor(row/2)*2;
const bc=Math.floor(col/3)*3;

for(let r=0;r<2;r++){
for(let c=0;c<3;c++){
const i=(br+r)*6+(bc+c);

if(i!==index&&board[i]===value)return true;
}
}

return false;
}

function showConflict(){
const cells=document.querySelectorAll(".cell");

cells.forEach(c=>c.classList.remove("conflict"));

for(let i=0;i<36;i++){
if(board[i]&&isConflict(i)){
cells[i].classList.add("conflict");
}
}
}

function checkWin(){
if(board.every((v,i)=>v===solution[i])){
finished=true;

clearInterval(timer);

boardEl.classList.add("finished");
boardCard.classList.add("winGlow");

if(gameRelaxed){
winText.innerHTML="";
}else{
const levelText =
currentLevel==="easy"
?"Easy"
:currentLevel==="hard"
?"Hard"
:"Normal";

const hintText=
hintUsed===0
?"เล่นจบโดยไม่ใช้ Hint 👏"
:`ใช้ Hint ไป ${hintUsed} ครั้ง`;

winText.innerHTML=`
<div>โหมด ${levelText}</div>
<div style="margin-top:8px">⏱ ใช้เวลา ${timerEl.textContent}</div>
<div style="margin-top:8px">${hintText}</div>
`;
}

winOverlay.style.display="flex";

vibrate([60,40,90]);
}
}

function toggleLevelMenu(){
document.getElementById("levelMenu").classList.toggle("show");
document.getElementById("menu").classList.remove("show");
}

function updateLevelUI(){
const label =
currentLevel==="easy"
?"E"
:currentLevel==="hard"
?"H"
:"N";

document.getElementById("levelBtn").textContent=label;

document.querySelectorAll("#levelMenu .menuItem").forEach(item=>{
item.classList.remove("active");
});

const activeIndex =
currentLevel==="easy"
?0
:currentLevel==="hard"
?2
:1;

document.querySelectorAll("#levelMenu .menuItem")[activeIndex].classList.add("active");
}

function setLevel(level){
currentLevel=level;

updateLevelUI();
document.getElementById("levelMenu").classList.remove("show");

newGame();
}

function toggleMenu(){
document.getElementById("menu").classList.toggle("show");
document.getElementById("levelMenu").classList.remove("show");
}

function applyTheme(){
const activeTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
?"dark"
:"light";

document.documentElement.setAttribute("data-theme",activeTheme);
}

function toggleTheme(){
const current=
document.documentElement.getAttribute("data-theme");

const nextTheme=
current==="dark"
?"light"
:"dark";

document.documentElement.setAttribute("data-theme",nextTheme);

document
.getElementById("menu")
.classList.remove("show");
}

function updateRelaxationUI(){
const item=document.getElementById("relaxMenuItem");

if(!item)return;

if(relaxationMode){
item.textContent="🧘 Relaxation: On";
item.classList.add("active");
}else{
item.textContent="🧘 Relaxation: Off";
item.classList.remove("active");
}
}

function toggleRelaxationMode(){
relaxationMode=!relaxationMode;

updateRelaxationUI();

document
.getElementById("menu")
.classList.remove("show");

newGame();
}

window
.matchMedia("(prefers-color-scheme: dark)")
.addEventListener("change",()=>{
applyTheme();
});

function openDonation(){
document.getElementById("menu").classList.remove("show");
document.getElementById("donationOverlay").style.display="flex";
}

function hideDonation(){
document.getElementById("donationOverlay").style.display="none";
}

function closeDonation(e){
if(e.target.id==="donationOverlay"){
hideDonation();
}
}

function addRippleEffect(){
const targets=document.querySelectorAll("button,.pill,.tool,.levelBtn,.settingsBtn,.menuItem");

targets.forEach(el=>{
el.addEventListener("click",function(e){
const rect=this.getBoundingClientRect();
const size=Math.max(rect.width,rect.height);
const ripple=document.createElement("span");

ripple.className="ripple";
ripple.style.width=`${size}px`;
ripple.style.height=`${size}px`;
ripple.style.left=`${e.clientX-rect.left-size/2}px`;
ripple.style.top=`${e.clientY-rect.top-size/2}px`;

this.appendChild(ripple);

setTimeout(()=>{
ripple.remove();
},450);
});
});
}

document.addEventListener("click",(e)=>{
const levelMenu=document.getElementById("levelMenu");
const levelBtn=document.getElementById("levelBtn");
const menu=document.getElementById("menu");
const settingsBtn=document.querySelector(".settingsBtn");

if(!levelMenu.contains(e.target)&&e.target!==levelBtn){
levelMenu.classList.remove("show");
}

if(!menu.contains(e.target)&&e.target!==settingsBtn){
menu.classList.remove("show");
}
});

applyTheme();
updateLevelUI();
updateRelaxationUI();
addRippleEffect();
newGame();
</script>
